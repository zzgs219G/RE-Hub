name: build re-tools

# 从零构建完整的逆向工具集，产出 Termux (Android arm64) 可直接使用的压缩包。
#
# 策略：能下载的直接下载，需要构建的才构建，已构建过的直接下现成的。
#
# 产物布局：
#   re-tools/
#   ├── bin/             命令入口（9 个）
#   ├── jadx/            dex → Java
#   ├── pymods/          Python 库
#   ├── radare2/         二进制分析（含 r2dec）
#   ├── android-tools/   aapt/zipalign/adb
#   └── apktool.jar      资源反编译
#
# 远端脚本放在 .github/scripts/ 下，不内联进 YAML ——
# 内联的 heredoc 缩进会破坏 YAML 结构（实测踩过）。

on:
  workflow_dispatch:
    inputs:
      python_version:
        description: '目标 Python 版本（须与 Termux 一致）'
        required: false
        default: '3.14'
      android_api:
        description: '最低 Android API'
        required: false
        default: '24'
      ndk_version:
        description: 'NDK 版本'
        required: false
        default: '29.0.0'
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  PYTHON_VERSION: ${{ github.event.inputs.python_version || '3.14' }}
  ANDROID_API: ${{ github.event.inputs.android_api || '24' }}
  NDK_VERSION: ${{ github.event.inputs.ndk_version || '29.0.0' }}
  # Termux 仓库索引
  TERMUX_PKGS_URL: https://packages.termux.dev/apt/termux-main/dists/stable/main/binary-aarch64/Packages.gz
  TERMUX_POOL: https://packages.termux.dev/apt/termux-main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@v4

      - name: 环境信息
        run: |
          set -euo pipefail
          nproc
          free -m | head -2
          df -h / | tail -1
          echo "目标: Python $PYTHON_VERSION / API $ANDROID_API / NDK $NDK_VERSION"

      - name: 安装构建工具
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            ninja-build cmake zip unzip curl file pkg-config meson

      - name: 安装 NDK
        run: |
          set -euo pipefail
          MAJOR="${NDK_VERSION%%.*}"
          curl -fsSL -o /tmp/ndk.zip \
            "https://dl.google.com/android/repository/android-ndk-r${MAJOR}-linux.zip"
          mkdir -p "$RUNNER_TEMP/ndk"
          unzip -q /tmp/ndk.zip -d "$RUNNER_TEMP/ndk"
          NDK_DIR=$(find "$RUNNER_TEMP/ndk" -maxdepth 1 -type d -name 'android-ndk-*' | head -1)
          test -d "$NDK_DIR" || { echo "✗ NDK 解压失败"; exit 1; }
          echo "NDK_DIR=$NDK_DIR" >> "$GITHUB_ENV"
          echo "✓ NDK: $NDK_DIR"

      - name: 拉取 Termux 包索引
        run: |
          set -euo pipefail
          curl -fsSL "$TERMUX_PKGS_URL" | gunzip > /tmp/Packages
          echo "索引条目数: $(grep -c '^Package: ' /tmp/Packages)"

      # ── 目标平台 Python 头文件 ──────────────────────────────────
      # C 扩展交叉编译必须用目标平台的 pyconfig.h。
      # runner 的 x86_64 版里 SIZEOF_LONG 等宏按 x86_64 生成，
      # 用错编出的模块结构体布局不对，真机 import 直接崩。
      - name: 取 Termux 的 Python 头文件
        run: |
          set -euo pipefail
          FILE=$(grep -A20 '^Package: python$' /tmp/Packages | grep '^Filename:' | head -1 | awk '{print $2}')
          test -n "$FILE" || { echo "✗ 索引里找不到 python 包"; exit 1; }
          echo "python deb: $FILE"
          curl -fsSL -o /tmp/py.deb "$TERMUX_POOL/$FILE"
          ls -lh /tmp/py.deb
          python3 .github/scripts/extract-deb.py /tmp/py.deb "$RUNNER_TEMP/pyext"
          # ⚠️ 必须找 include/ 下的，不能用 -name "python3.14" 泛搜 ——
          # 解包树里同时有 lib/python3.14（纯 Python 标准库，无 pyconfig.h）
          # 和 include/python3.14（头文件）。泛搜会先命中 lib 下的那个，
          # 然后 pyconfig.h 不存在直接失败（run 43612020875 实测）。
          PYINC=$(find "$RUNNER_TEMP/pyext" -type d -path "*/include/python${PYTHON_VERSION}" | head -1)
          [ -n "$PYINC" ] || PYINC=$(find "$RUNNER_TEMP/pyext" -name pyconfig.h -type f 2>/dev/null | head -1 | xargs -r dirname)
          test -n "$PYINC" || { echo "✗ 找不到 python${PYTHON_VERSION} 头文件"; find "$RUNNER_TEMP/pyext" -name pyconfig.h; echo "--- 目录树:"; find "$RUNNER_TEMP/pyext" -maxdepth 8 -type d -name "python*" | head; exit 1; }
          echo "Python include: $PYINC"
          grep -E '^#define (SIZEOF_LONG|SIZEOF_VOID_P) ' "$PYINC/pyconfig.h" | sed 's/^/  /'
          for k in SIZEOF_LONG SIZEOF_VOID_P; do
            v=$(grep -E "^#define $k " "$PYINC/pyconfig.h" | awk '{print $3}')
            [ "$v" = "8" ] || { echo "✗ $k=$v，不是 aarch64 头文件" >&2; exit 1; }
          done
          echo "PYINC=$PYINC" >> "$GITHUB_ENV"
          echo "✓ 头文件校验通过（64 位目标平台）"

      - name: 准备输出目录
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/dist/re-tools"
          mkdir -p "$OUT"/{bin,jadx,pymods,radare2/bin,radare2/lib,radare2/plugins,android-tools}
          echo "OUT=$OUT" >> "$GITHUB_ENV"
          echo "✓ $OUT"

      # ══════════════════════════════════════════════════════
      # 一、直接下载（上游已有现成产物）
      # ══════════════════════════════════════════════════════
      #
      # ⚠️ 每个组件都用 actions/cache 缓存产物。
      # 调试期间这是提速关键：改某一环时，其余环节直接命中缓存跳过，
      # 一轮从 10 分钟降到 1 分钟。正常发版时缓存也会命中，
      # 只有当上游版本号变了才重新下载（key 里带版本号）。
      # 清缓存：Actions 页面 → Caches → 删除对应条目。

      - name: 缓存 jadx
        uses: actions/cache@v4
        with:
          path: dist/re-tools/jadx
          key: re-jadx-1.5.6

      - name: jadx（下载）
        run: |
          set -euo pipefail
          V=1.5.6
          if [ -f "$OUT/jadx/lib/jadx-${V}-all.jar" ]; then
              echo "✓ 命中缓存，跳过下载"
              exit 0
          fi
          curl -fsSL -o /tmp/jadx.zip \
            "https://github.com/skylot/jadx/releases/download/v${V}/jadx-${V}.zip"
          unzip -q /tmp/jadx.zip -d "$OUT/jadx"
          test -f "$OUT/jadx/lib/jadx-${V}-all.jar" || { echo "✗ jadx jar 缺失"; ls -R "$OUT/jadx" | head; exit 1; }
          echo "✓ jadx $V ($(du -h "$OUT/jadx/lib/jadx-${V}-all.jar" | cut -f1))"

      - name: 缓存 apktool
        uses: actions/cache@v4
        with:
          path: dist/re-tools/apktool.jar
          key: re-apktool-3.0.3

      - name: apktool（下载）
        run: |
          set -euo pipefail
          V=3.0.3
          if [ -s "$OUT/apktool.jar" ]; then
              echo "✓ 命中缓存，跳过下载"
              exit 0
          fi
          curl -fsSL -o "$OUT/apktool.jar" \
            "https://github.com/iBotPeaches/Apktool/releases/download/v${V}/apktool_${V}.jar"
          test -s "$OUT/apktool.jar" || { echo "✗ apktool.jar 下载失败"; exit 1; }
          echo "✓ apktool $V ($(du -h "$OUT/apktool.jar" | cut -f1))"

      - name: 缓存 radare2
        uses: actions/cache@v4
        with:
          path: dist/re-tools/radare2
          key: re-r2-6.2.6

      - name: radare2（下载 Termux 原生包）
        run: |
          set -euo pipefail
          # 命中缓存则跳过
          if [ -x "$OUT/radare2/bin/r2" ] && [ -d "$OUT/radare2/lib" ]; then
              echo "✓ 命中缓存，跳过下载"
              exit 0
          fi
          # 不从源码编：radare2 含 23 个 so + 数据文件，
          # 交叉编译耗时长且依赖复杂。Termux 官方包是 aarch64 且已验证。
          FILE=$(grep -A20 '^Package: radare2$' /tmp/Packages | grep '^Filename:' | head -1 | awk '{print $2}')
          VER=$(grep -A20 '^Package: radare2$' /tmp/Packages | grep '^Version:' | head -1 | awk '{print $2}')
          test -n "$FILE" || { echo "✗ 索引里找不到 radare2"; exit 1; }
          echo "radare2 $VER ($FILE)"
          curl -fsSL -o /tmp/r2.deb "$TERMUX_POOL/$FILE"
          python3 .github/scripts/extract-deb.py /tmp/r2.deb /tmp/r2ext
          USR=$(find /tmp/r2ext -type d -path '*com.termux/files/usr' | head -1)
          test -n "$USR" || { echo "✗ 解包失败"; find /tmp/r2ext -maxdepth 5 -type d | head; exit 1; }
          for b in r2 radare2 rabin2 rax2 rasm2 r2pm; do
            [ -f "$USR/bin/$b" ] && cp -a "$USR/bin/$b" "$OUT/radare2/bin/"
          done
          cp -a "$USR"/lib/libr_*.so* "$OUT/radare2/lib/" 2>/dev/null || true
          [ -d "$USR/share/radare2" ] && cp -a "$USR/share/radare2" "$OUT/radare2/share/"
          echo "  可执行: $(ls "$OUT/radare2/bin" | tr '\n' ' ')"
          echo "  库文件: $(ls "$OUT/radare2/lib" | wc -l) 个"
          echo "✓ radare2 $VER ($(du -sh "$OUT/radare2" | cut -f1))"

      - name: 缓存 android-tools
        uses: actions/cache@v4
        with:
          path: dist/re-tools/android-tools
          key: re-androidtools-lz-35.0.2

      - name: android-tools（下载 lzhiyong 静态编译包）
        run: |
          set -euo pipefail
          # 用 lzhiyong/android-sdk-tools 的静态编译版：
          # aapt/aapt2/zipalign/adb 全静态链接，无运行时依赖。
          # （Termux 的 android-tools 包只有 adb；aapt 在独立包里且依赖
          #   abseil-cpp/libprotobuf 等一长串运行时库。）
          V=35.0.2
          curl -fsSL -o /tmp/sdktools.zip \
            "https://github.com/lzhiyong/android-sdk-tools/releases/download/${V}/android-sdk-tools-static-aarch64.zip"
          cd /tmp && rm -rf sdkext && mkdir sdkext && cd sdkext
          unzip -q /tmp/sdktools.zip
          ls build-tools platform-tools 2>/dev/null | head
          for b in aapt aapt2 zipalign dexdump; do
            [ -f "build-tools/$b" ] && cp "build-tools/$b" "$OUT/android-tools/" && echo "  + $b"
          done
          for b in adb fastboot sqlite3; do
            [ -f "platform-tools/$b" ] && cp "platform-tools/$b" "$OUT/android-tools/" && echo "  + $b"
          done
          echo "✓ android-tools（静态版，$(du -sh "$OUT/android-tools" | cut -f1)）"

      # ══════════════════════════════════════════════════════
      # 二、Python 库
      # ══════════════════════════════════════════════════════

      - name: 缓存纯 Python 库
        uses: actions/cache@v4
        with:
          # 只缓存这些库自己的目录，不缓存整个 pymods ——
          # 整个缓存会掩盖 C 扩展步骤的问题（缓存键不同但目录重叠）
          path: |
            dist/re-tools/pymods/androguard
            dist/re-tools/pymods/r2pipe
            dist/re-tools/pymods/elftools
            dist/re-tools/pymods/yaml
            dist/re-tools/pymods/networkx
            dist/re-tools/pymods/pydot
            dist/re-tools/pymods/asn1crypto
            dist/re-tools/pymods/click
            dist/re-tools/pymods/colorama
            dist/re-tools/pymods/loguru
            dist/re-tools/pymods/pyasn1
            dist/re-tools/pymods/future
            dist/re-tools/pymods/past
            dist/re-tools/pymods/apkInspector
            dist/re-tools/pymods/apkInspectorCLI
            dist/re-tools/pymods/dataset
            dist/re-tools/pymods/pygments
            dist/re-tools/pymods/alembic
            dist/re-tools/pymods/sqlalchemy
            dist/re-tools/pymods/mako
            dist/re-tools/pymods/typing_extensions
            dist/re-tools/pymods/greenlet
          key: re-purepy-2026-11-15

      - name: 纯 Python 库（直接下载）
        run: |
          set -euo pipefail
          # 无 C 扩展，任何平台都能用，直接 pip 装。
          # ⚠️ 列表里只写【PyPI 上的包名】，不是 import 名：
          #   past 是 future 包的一部分（不是独立包）
          #   apkInspectorCLI 是 apkInspector 包的一部分
          # 实测(run 43612261527)把它们当包名会 404 导致整步失败。
          #
          # ⚠️ 用 --no-deps 装就必须自己列全依赖。
          # androguard 的硬依赖里，dataset 仅用于 session.py 的缓存功能
          # （核心的 core.dex / core.apk 不需要），ipython 只用于 CLI 交互。
          # 实测：只装 androguard 本体时 core.dex 能正常 import。
          PURE="androguard r2pipe pyelftools pyyaml networkx pydot asn1crypto click colorama loguru pyasn1 future apkInspector dataset pygments"
          FAILED=""
          for p in $PURE; do
              # ⚠️ pyyaml 带 C 扩展 _yaml：--only-binary 会让 runner 拿
              # x86_64 的 wheel（run #9 实测：pymods/yaml/_yaml*.so 是
              # x86_64-linux-gnu）。它必须和其他 C 扩展一样走交叉编译，
              # 或干脆不带 _yaml（纯 Python 回退完全可用，只是解析慢些）。
              # 这里选后者：从源码装且禁掉 C 扩展（PYYAML_FORCE_LIBYAML=0）。
              if [ "$p" = "pyyaml" ]; then
                  if PYYAML_FORCE_LIBYAML=0 python3 -m pip install --target "$OUT/pymods" --no-deps \
                         --no-binary :all: --no-cache-dir -q "$p" 2>/dev/null; then
                      echo "  ✓ $p（纯 Python 模式，不带 _yaml）"
                  else
                      echo "  ✗ $p"
                      FAILED="$FAILED $p"
                  fi
                  continue
              fi
              if python3 -m pip install --target "$OUT/pymods" --no-deps \
                     --only-binary :all: --no-cache-dir -q "$p" 2>/dev/null; then
                  echo "  ✓ $p"
              else
                  echo "  ✗ $p"
                  FAILED="$FAILED $p"
              fi
          done
          [ -z "$FAILED" ] || { echo "✗ 以下纯 Python 库下载失败:$FAILED" >&2; exit 1; }
          echo "✓ 共 $(ls "$OUT/pymods" | wc -l) 个条目"
          # ⚠️ 这里不做 import 验证：androguard 依赖 lxml，而 lxml 是
          # C 扩展，要等后面的交叉编译步骤。在这个位置验证必然失败
          # （实测 run 43614568368：报 No module named 'lxml'）。
          # 完整验证在所有库就位之后的"最终验证"步骤。
      - name: 设置交叉编译环境
        run: |
          set -euo pipefail
          TOOLCHAIN="$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64"
          CC="$TOOLCHAIN/bin/aarch64-linux-android${ANDROID_API}-clang"
          CXX="$TOOLCHAIN/bin/aarch64-linux-android${ANDROID_API}-clang++"
          AR="$TOOLCHAIN/bin/llvm-ar"
          SYSROOT="$TOOLCHAIN/sysroot"
          test -x "$CC" || { echo "✗ 找不到交叉编译器: $CC"; exit 1; }

          # ── cmake wrapper ─────────────────────────────────────
          # 为什么需要：unicorn 的 setup.py 直接 subprocess 调
          #   ['cmake', '-B', ...]（setup.py:123-126），不读 CMAKE_ARGS，
          #   也不透传 CC 之外的工具链参数。cmake 虽然会读 CC 环境变量，
          #   但 NDK 交叉编译还需要 toolchain file（sysroot/stl 等），
          #   只换 CC 不够，编到一半会因为找不到头文件/符号失败
          #   （实测 run 43614947895：cmake --build 退出码 2）。
          # 解法：造一个 cmake 包装脚本放在 PATH 最前面，
          #   首次配置时自动注入 toolchain file，后续 --build 原样透传。
          WRAPDIR="$RUNNER_TEMP/cmakewrap"
          mkdir -p "$WRAPDIR"
          cat > "$WRAPDIR/cmake" <<WRAP
          #!/bin/bash
          # 首次配置（有 -S 但没有 TOOLCHAIN 参数）时注入 NDK toolchain
          if [[ " \$*" == *"-S "* ]] && [[ " \$*" != *"CMAKE_TOOLCHAIN_FILE"* ]]; then
              exec /usr/bin/cmake "\$@" \\
                  -DCMAKE_TOOLCHAIN_FILE=$NDK_DIR/build/cmake/android.toolchain.cmake \\
                  -DANDROID_ABI=arm64-v8a \\
                  -DANDROID_PLATFORM=android-$ANDROID_API
          fi
          exec /usr/bin/cmake "\$@"
          WRAP
          chmod +x "$WRAPDIR/cmake"
          # 验证 wrapper 语法（不能等到编译时才发现写错）
          bash -n "$WRAPDIR/cmake" || { echo "✗ cmake wrapper 语法错误"; exit 1; }

          {
            echo "_PYTHON_HOST_PLATFORM=linux-aarch64"
            echo "CC=$CC"
            echo "CXX=$CXX"
            echo "AR=$AR"
            echo "RANLIB=$TOOLCHAIN/bin/llvm-ranlib"
            echo "STRIP=$TOOLCHAIN/bin/llvm-strip"
            echo "LDSHARED=$CC -shared"
            echo "CFLAGS=-I$PYINC -fPIC -O2"
            echo "CXXFLAGS=-I$PYINC -fPIC -O2"
            echo "LDFLAGS=--sysroot=$SYSROOT -L$SYSROOT/usr/lib/aarch64-linux-android/$ANDROID_API"
            echo "PATH=$WRAPDIR:$TOOLCHAIN/bin:$PATH"
          } >> "$GITHUB_ENV"
          echo "✓ 交叉编译环境就绪（含 cmake wrapper）"
          echo "  CC=$CC"

      - name: 缓存 C 扩展编译结果
        uses: actions/cache@v4
        with:
          path: |
            dist/re-tools/pymods/unicorn
            dist/re-tools/pymods/capstone
            dist/re-tools/pymods/Crypto
            dist/re-tools/pymods/lxml
          key: re-cext-py${{ env.PYTHON_VERSION }}-api${{ env.ANDROID_API }}-v1

      - name: C 扩展库（交叉编译）
        run: |
          set -euo pipefail
          # 这几个在 PyPI 上没有 Android wheel，必须从源码编译。
          # 逐个来，任何一个失败立即报错——缺了就说明工具集不完整。
          #
          # 每个库单独判断缓存：已存在就跳过。这样某个库编译失败时，
          # 修好后重跑只编那一个，不用等全部重来。
          # 目录名与 pip 的 import 名不同，见下方映射。
          declare -A DIRS=(
            [unicorn]=unicorn
            [capstone]=capstone
            [pycryptodome]=Crypto
            [lxml]=lxml
          )
          for p in unicorn capstone pycryptodome lxml; do
              d="${DIRS[$p]}"
              # 判断是否已有编译产物（有 .so 才算）
              if find "$OUT/pymods/$d" -name '*.so' -type f 2>/dev/null | grep -q .; then
                  echo "✓ $p（命中缓存，跳过编译）"
                  continue
              fi
              echo "════ $p ════"
              # ⚠️ 不用 tail 截断输出：unicorn 的 cmake 错误在 traceback
              #    上方几百行处，tail -20 会把它切掉，导致只能看到
              #    "returned non-zero exit status 2" 而无法诊断。
              #    让完整日志进 CI 日志（GitHub 会自动折叠）。
              if [ "$p" = "unicorn" ]; then
                  # unicorn 需要打补丁（NDK 下 cmake 不产出带版本号的
                  # libunicorn.so.2，setup.py 会 FileNotFoundError），
                  # 所以走"下载→补丁→本地安装"而不是直接 pip 装。
                  # 详见 .github/scripts/patch-unicorn.py
                  SRCDIR="/tmp/src-unicorn"
                  rm -rf "$SRCDIR" && mkdir -p "$SRCDIR"
                  if ! python3 -m pip download --no-deps --no-binary :all: \
                          --no-cache-dir -d "$SRCDIR" unicorn; then
                      echo "✗ unicorn 源码下载失败" >&2; exit 1
                  fi
                  tar xzf "$SRCDIR"/unicorn-*.tar.gz -C "$SRCDIR"
                  UROOT=$(find "$SRCDIR" -maxdepth 1 -type d -name 'unicorn-*' | head -1)
                  python3 "$GITHUB_WORKSPACE/.github/scripts/patch-unicorn.py" "$UROOT" \
                    || { echo "✗ unicorn 打补丁失败" >&2; exit 1; }
                  if ! python3 -m pip install --target "$OUT/pymods" --no-deps \
                          --no-cache-dir --no-build-isolation "$UROOT"; then
                      echo "✗ unicorn 编译失败" >&2
                      exit 1
                  fi
              elif [ "$p" = "lxml" ]; then
                  # lxml 依赖目标平台的 libxml2/libxslt（C 库），交叉编译要把
                  # 整个依赖链（libiconv/libgcrypt/...）都备齐才能编。
                  # Termux 有现成的 python-lxml 6.1.3（与本机同版本），
                  # 直接解包拿扩展模块；运行时库放进 radare2/lib
                  # （repy 已把该目录加入 LD_LIBRARY_PATH）。
                  echo "  （lxml 走 Termux 预编译包，跳过源码编译）"
                  python3 .github/scripts/fetch-termux-pkg.py python-lxml "$OUT/pymods"
                  # site-packages 里的内容要挪到 pymods 顶层
                  SP=$(find "$OUT/pymods" -type d -name "site-packages" | head -1)
                  if [ -n "$SP" ]; then
                      cp -a "$SP"/* "$OUT/pymods/" && rm -rf "$SP"
                      echo "  ✓ site-packages 内容已并入 pymods/"
                  fi
                  mkdir -p "$OUT/radare2/lib"
                  for pkg in libxml2 libxslt libiconv libgcrypt libgpg-error libandroid-glob; do
                      python3 .github/scripts/fetch-termux-pkg.py "$pkg" "/tmp/_libs_$pkg"
                      # 只取 .so 文件放进 radare2/lib
                      find "/tmp/_libs_$pkg" -name "*.so*" -type f \
                          -exec cp -a {} "$OUT/radare2/lib/" \; 2>/dev/null || true
                      echo "  + $pkg"
                  done
                  # 建无版本号的符号链接：deb 里的主文件是 libxml2.so.16.1.4，
                  # 但 lxml 的 .so 链接的是 libxml2.so.16 —— 没有这个链接
                  # 真机 dlopen 会报 library not found
                  for f in "$OUT/radare2"/lib*.so.[0-9]*.[0-9]*.[0-9]*; do
                      [ -e "$f" ] || continue
                      base="${f%.so.*}"
                      minor="${f#*.so.}"          # 16.1.4
                      soname="$base.so.${minor%%.*}"  # libxml2.so.16
                      [ -e "$soname" ] || { ln -s "$(basename "$f")" "$soname"; echo "  链接: $(basename "$soname") → $(basename "$f")"; }
                  done
                  echo "  运行时库: $(ls "$OUT/radare2/lib" | grep -E 'libxml|libxslt|libiconv|libgcrypt|libgpg|glob' | tr '\n' ' ')"
                  echo "✓ lxml"
              else
                  if ! python3 -m pip install --target "$OUT/pymods" --no-deps \
                          --no-binary :all: --no-cache-dir "$p"; then
                      echo "✗ $p 编译失败" >&2
                      exit 1
                  fi
              fi
              echo "✓ $p"
          done

      - name: 检查 C 扩展架构
        run: |
          set -euo pipefail
          echo "=== pymods 里的 .so ==="
          BAD=0
          while IFS= read -r f; do
              if file "$f" | grep -q 'x86-64'; then
                  echo "  ✗ $f 是 x86_64"
                  BAD=$((BAD+1))
              else
                  echo "  ✓ $(basename "$f")"
              fi
          done < <(find "$OUT/pymods" -name '*.so' -type f)
          if [ "$BAD" -gt 0 ]; then
              echo "✗ 混入 $BAD 个 x86_64 的 .so" >&2
              exit 1
          fi
          echo "✓ 全部是目标平台架构"

      # ══════════════════════════════════════════════════════
      # 三、两个特殊库
      # ══════════════════════════════════════════════════════

      - name: 缓存 lief
        uses: actions/cache@v4
        with:
          path: dist/re-tools/pymods/lief
          key: re-lief-0.17.6

      - name: lief（下载已构建产物）
        run: |
          set -euo pipefail
          # 命中缓存则跳过
          if find "$OUT/pymods/lief" -name '_lief*.so' 2>/dev/null | grep -q .; then
              echo "✓ 命中缓存，跳过"
              exit 0
          fi
          # PyPI 的 lief sdist 是 mock 包（7.8KB，src/ 被剔除），
          # 无法从 pip 构建。已有现成产物，直接下载。
          URL="https://github.com/zzgs219G/termux-build/releases/download/v2/lief-py3.14-android-arm64.tar.gz"
          curl -fsSL -o /tmp/lief.tar.gz "$URL" || { echo "✗ 下载失败: $URL" >&2; exit 1; }
          tar xzf /tmp/lief.tar.gz -C /tmp
          test -d /tmp/lief || { echo "✗ 解压后没有 lief/"; exit 1; }
          rm -rf "$OUT/pymods/lief"
          cp -a /tmp/lief "$OUT/pymods/lief"
          SO=$(find "$OUT/pymods/lief" -name '_lief*.so' | head -1)
          test -n "$SO" || { echo "✗ 找不到 _lief*.so"; ls "$OUT/pymods/lief"; exit 1; }
          file "$SO"
          file "$SO" | grep -qi aarch64 || { echo "✗ lief 不是 aarch64" >&2; exit 1; }
          echo "✓ lief ($(du -sh "$OUT/pymods/lief" | cut -f1))"

      - name: 缓存 keystone
        uses: actions/cache@v4
        with:
          path: dist/re-tools/pymods/keystone
          key: re-keystone-0.9.2-py${{ env.PYTHON_VERSION }}

      - name: keystone（打补丁后交叉编译）
        run: |
          set -euo pipefail
          # 命中缓存则跳过（有 libkeystone.so 才算完整）
          if [ -f "$OUT/pymods/keystone/libkeystone.so" ]; then
              echo "✓ 命中缓存，跳过编译"
              exit 0
          fi
          # PyPI 的 sdist 用了已废弃的 CMP0051 策略，新版 CMake 拒绝。
          # 补丁脚本见 .github/scripts/patch-keystone.py
          cd /tmp
          rm -rf ks && mkdir ks && cd ks
          python3 -m pip download --no-deps --no-binary :all: --no-cache-dir keystone-engine
          tar xzf keystone-engine-*.tar.gz
          cd keystone-engine-*/
          python3 "$GITHUB_WORKSPACE/.github/scripts/patch-keystone.py" .
          cd src && mkdir -p build && cd build
          cmake .. -G Ninja \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_DIR/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM="android-${ANDROID_API}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_LIBS_ONLY=ON \
            -DBUILD_SHARED_LIBS=ON \
            -DLLVM_TARGETS_TO_BUILD="AArch64"
          cmake --build . -j"$(nproc)"
          LIB=$(find . -name 'libkeystone.so*' -type f | head -1)
          test -n "$LIB" || { echo "✗ 没产出 libkeystone.so"; find . -name '*.so*' | head; exit 1; }
          file "$LIB"
          file "$LIB" | grep -qi aarch64 || { echo "✗ 不是 aarch64" >&2; exit 1; }
          cd /tmp/ks/keystone-engine-*/
          cp -a keystone "$OUT/pymods/"
          cp "$(find src/build -name 'libkeystone.so*' -type f | head -1)" \
             "$OUT/pymods/keystone/libkeystone.so"
          rm -rf "$OUT/pymods/keystone/__pycache__"
          echo "✓ keystone ($(du -sh "$OUT/pymods/keystone" | cut -f1))"

      - name: r2dec（交叉编译 r2 插件）
        run: |
          set -euo pipefail
          cd /tmp
          rm -rf r2dec && git clone --depth=1 https://github.com/wargio/r2dec-js r2dec
          cd r2dec

          # ⚠️ r2 头文件要自己准备，不能依赖前面步骤的 /tmp 残留：
          #    radare2 命中缓存时其解包步骤被跳过，/tmp/r2ext 不存在
          #    （run #11 实测）。这里检测到没有就重新解包一次。
          R2INC=$(find /tmp/r2ext -type d -name libr 2>/dev/null | head -1)
          if [ -z "$R2INC" ]; then
              echo "（radare2 解包不存在，重新下载头文件）"
              FILE=$(grep -A20 '^Package: radare2$' /tmp/Packages | grep '^Filename:' | head -1 | awk '{print $2}')
              test -n "$FILE" || { echo "✗ 索引里找不到 radare2"; exit 1; }
              curl -fsSL -o /tmp/r2hdr.deb "$TERMUX_POOL/$FILE"
              python3 "$GITHUB_WORKSPACE/.github/scripts/extract-deb.py" /tmp/r2hdr.deb /tmp/r2ext
              R2INC=$(find /tmp/r2ext -type d -name libr | head -1)
          fi
          test -n "$R2INC" || { echo "✗ 找不到 radare2 头文件（r2dec 编译需要）"; exit 1; }
          echo "r2 include: $R2INC"

          # 交叉编译：r2dec 是 r2 的插件，目标平台是 Android arm64，
          # 编译时要用 NDK 的 clang + r2 的头文件。
          CC="$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${ANDROID_API}-clang"
          # meson 交叉编译需要 cross file（host machine = aarch64 android）
          CROSS="$RUNNER_TEMP/r2dec-cross.ini"
          # ⚠️ 不用 heredoc：YAML run 块里的结束符会被缩进，bash
          #    永远找不到它，把后面全部行吞进 heredoc（第三次踩坑）。
          printf '[binaries]\nc = '"'"'%s'"'"'\n[host_machine]\nsystem = '"'"'%s'"'"'\ncpu_family = aarch64\ncpu = aarch64\nendian = little\n' "$CC" android > "$CROSS"
          # r2dec 与 r2 6.2.6 的 API 可能不兼容，失败不阻塞整体构建
          # （本工具集的其他部分都已完成，r2dec 只影响 pdd 反编译命令）
          if meson setup b --backend=ninja --cross-file "$CROSS" \
               -Dc_args="-I$R2INC" \
               -Dr2_plugdir="$OUT/radare2/plugins" 2>&1 | tail -15; then
              ninja -C b 2>&1 | tail -10 || true
          fi
          SO=$(find /tmp/r2dec "$OUT/radare2/plugins" -name 'libcore_pdd*.so' 2>/dev/null | head -1)
          if [ -n "$SO" ]; then
              mkdir -p "$OUT/radare2/plugins"
              cp "$SO" "$OUT/radare2/plugins/"
              file "$OUT/radare2/plugins/libcore_pdd.so"
              echo "✓ r2dec"
          else
              echo "⚠ r2dec 编译失败（不影响其他工具，仅缺 pdd 反编译命令）"
              echo "  这通常意味着 r2dec 与 r2 6.2.6 的 API 不兼容"
          fi

      # ══════════════════════════════════════════════════════
      # 四、打包
      # ══════════════════════════════════════════════════════

      - name: 最终验证（所有库就位后）
        run: |
          set -euo pipefail
          # 到这里所有组件都已放入。
          # ⚠️ 只能做静态检查（文件在不在、架构对不对），不能做
          # runtime import —— runner 是 x86_64，Android 的 .so 在它
          # 上面根本无法加载（run #10 实测 8 个模块全挂）。
          # runtime 验证由用户在手机上跑 doctor 完成。
          echo "=== import 验证 ==="
          python3 "$GITHUB_WORKSPACE/.github/scripts/verify-pymods.py" --static "$OUT/pymods"

      - name: 安装 bin 脚本
        run: |
          set -euo pipefail
          cp -a "$GITHUB_WORKSPACE"/.github/scripts/bin/. "$OUT/bin/"
          chmod +x "$OUT/bin"/*
          echo "✓ bin 脚本: $(ls "$OUT/bin" | tr '\n' ' ')"

      - name: 生成 README
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/.github/scripts/README-template.md" "$OUT/README.md"
          # 把实际版本号填进去
          sed -i "s/{{PYTHON_VERSION}}/$PYTHON_VERSION/g" "$OUT/README.md"
          sed -i "s/{{BUILD_DATE}}/$(date -u +%Y-%m-%d)/g" "$OUT/README.md"
          echo "✓ README"

      - name: 汇总体积
        run: |
          set -euo pipefail
          echo "=== 各组件体积 ==="
          for d in jadx pymods radare2 android-tools bin; do
              printf "  %-16s %8s\n" "$d" "$(du -sh "$OUT/$d" 2>/dev/null | cut -f1)"
          done
          [ -f "$OUT/apktool.jar" ] && printf "  %-16s %8s\n" "apktool.jar" "$(du -h "$OUT/apktool.jar" | cut -f1)"
          printf "  %-16s %8s\n" "总计" "$(du -sh "$OUT" | cut -f1)"

      - name: 打包 tar.gz
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/dist"
          # tar.gz 保留权限位和符号链接（zip 会丢权限）
          tar czf re-tools-arm64.tar.gz re-tools
          ls -lh re-tools-arm64.tar.gz
          sha256sum re-tools-arm64.tar.gz | tee re-tools-arm64.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: re-tools-arm64
          path: |
            dist/re-tools-arm64.tar.gz
            dist/re-tools-arm64.tar.gz.sha256
          if-no-files-found: error

      - name: 发布到 Release（仅 tag 触发）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/re-tools-arm64.tar.gz
            dist/re-tools-arm64.tar.gz.sha256
          name: re-tools ${{ github.ref_name }}
          body: |
            Termux (Android arm64) 完整逆向工具集，由 CI 从零构建。

            ## 安装

            ```bash
            tar xzf re-tools-arm64.tar.gz -C ~
            export PATH="$HOME/re-tools/bin:$PATH"
            export PYTHONPATH="$HOME/re-tools/pymods"
            doctor
            ```

            外部依赖：

            ```bash
            pkg install openjdk-21 python apksigner
            ```
